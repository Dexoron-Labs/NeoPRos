[package]
name = "neopros"
version = "0.1.0"
dcr-version = "0.8.5"
type = "none"
description = "NeoPRos — 32-bit i386 OS fully written by AI"
author = "AI"
license = "GPL-3.0-or-later"

[build]
language = "c"
standard = "c11"
compiler = "clang"
kind = "elf"
target = "i386-none-elf"
freestanding = true
filename = "neopros"
roots = ["src"]
cflags = ["--target=i386-none-elf", "-ffreestanding", "-fno-builtin", "-fno-stack-protector", "-fno-pic", "-fno-pie", "-mno-sse", "-mno-mmx", "-mno-80387", "-Wall", "-Wextra"]
ldflags = ["-T", "src/linker.ld"]

[build.asm]
compiler = "nasm"
flags = ["-felf32"]

[dependencies]
